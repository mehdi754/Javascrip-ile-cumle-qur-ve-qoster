<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <!--external css-->
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f8ff;
            text-align:center ;
            padding-top:50px ;
        }

        label{
            display: block;
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }

        input{
            width:250px ;
            font-size: 16px;
            border: 2px solid #4caf50;
            border-radius: 8px;
            margin-top: 5px;
            padding: 10px;
        }

        button{
            margin-top: 20px;
            padding:10px 25px ;
            font-size: 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: backround-color 0.3s  ease;
        }

        button:hover {
            background-color: #45a049;
        }

        
    </style>
    <script>       
    function showMessage(){

        let name = document.getElementById("nameInput").value;
        
        let age = document.getElementById("ageInput").value;
        
        let color = document.getElementById("colorInput").value; 
        
        let animal = document.getElementById("animalInput").value;

        let  location = document.getElementById("locationInput").value;

        let message = "Salam, " + name + "! Sən " + age + " yaşındasan və sevdiyin rəng " + color + 
              ", sevdiyin heyvan " + animal + ", və sən " + location + " şəhərində yaşayırsan.";

        document.getElementById("result").innerHTML = message
    }

    </script>
</head>
<body>
    <label for="">Adinizi yazin:</label>
    <input type="text" id="nameInput"><br><br>

    <label for="">Yasinizi yazin:</label>
    <input type="number" id="ageInput"><br><br>

    <label for="">Sevdiyiniz reng:</label>
    <input type="text" id="colorInput"><br><br>

    <label for="">Sevdiyiniz heyvan:</label>
    <input type="text" id="animalInput"><br><br>

    <label for="">Yasadiqiniz seher:</label>
    <input type="text" id="locationInput"><br><br>



    <button onclick="showMessage()">Goster</button>

    <p id="result"></p>

</body>
</html>
